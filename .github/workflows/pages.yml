name: Deploy web app to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: |
          pip install -e ".[dev]"
          npm ci

      # Nothing is published unless both cores still agree with the shared
      # vectors and the interface still behaves. A drifted browser build or a
      # broken poka-yoke must not be able to reach production.
      - name: Python conformance
        run: pytest -q

      - name: Browser conformance
        run: node web/js/conformance.mjs

      - name: Generate vendor database from the packaged IEEE CSVs
        run: python scripts/build_web_data.py

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser behaviour, layout, and accessibility
        run: npx playwright test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -e ".[dev]"

      - name: Conformance vectors and unit tests
        run: pytest -q

      # The core has no third-party dependencies on purpose, because it has to
      # run on a locked-down jump box. This proves it stays that way.
      - name: Core imports with no optional dependencies installed
        run: |
          pip uninstall -y pyyaml
          python -c "from macsmith import mac, table, registry, cli; print('stdlib-only core OK')"

  browser-core:
    name: Browser core matches the shared vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node web/js/conformance.mjs

  browser-ui:
    name: Browser behaviour, layout, and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The suite fetches the vendor database, so it has to exist first.
      - name: Generate vendor database
        run: |
          pip install -e .
          python scripts/build_web_data.py

      # Runs at 360, 390, 768, and 1280. Breakpoints are a test axis here, so
      # the narrow layout cannot rot while someone develops against a laptop.
      - name: Playwright
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
